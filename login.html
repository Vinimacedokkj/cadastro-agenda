<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="variaveis.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="div-container-de-tudo">
        <h1>Entrar</h1>
        <p id="infos-login">Acesse com seu usuário e senha</p>

        <div class="div-dos-dados-para-login">
            <div class="div-usuario">
                <label for="usuario-login">Usuário</label>
                <input id="usuario-login" type="text">
            </div>
            <div class="div-senha">
                <label for="senha-login">Senha</label>
                <input id="senha-login" type="password">
            </div>
        </div>

        <button class="botao" id="botao-login" onclick="validarUsuario()">Entrar</button>

        <div class="div-do-texto-abaixo-do-botao">
            <p>Não tem conta? <a href="/signup.html">Criar cadastro</a></p>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
