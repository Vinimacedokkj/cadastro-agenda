<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="variaveis.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="div-container-de-tudo">
        <h1>Criar conta</h1>
        <p id="infos-criar-conta">Usuário (min. 3 caracteres) e senha (min. 6 caracteres)</p>

        <div class="div-dos-dados-para-login">
            <div class="div-usuario">
                <label for="usuario-cadastro">Email</label>
                <input id="usuario-cadastro" type="email" required>
            </div>
            <div class="div-senha">
                <label for="senha-cadastro">Senha</label>
                <input id="senha-cadastro" type="password">
            </div>
            <div class="div-senha">
                <label for="confirmar-senha-cadastro">Confirmar senha</label>
                <input id="confirmar-senha-cadastro" type="password">
            </div>
        </div>

        <button class="botao" id="botao-cadastrar" onclick="cadastrarUsuario()">Cadastrar</button>

        <div class="div-do-texto-abaixo-do-botao">
            <p>Já tem conta? <a href="/login.html">Entrar</a></p>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
