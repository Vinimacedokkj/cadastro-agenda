<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="variaveis.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="div-container-de-tudo">
        <h1>Entrar</h1>
        <p id="infos-login">Acesse com seu usuário e senha</p>

        <div class="div-dos-dados-para-login">
            <div class="div-usuario">
                <label for="usuario-login">Email</label>
                <input id="usuario-login" type="email" required>
            </div>
            <div class="div-senha">
                <label for="senha-login">Senha</label>
                <input id="senha-login" type="password">
            </div>
        </div>

        <button class="botao" id="botao-login" onclick="validarUsuario()">Entrar</button>

        <div class="div-do-texto-abaixo-do-botao">
            <p>Não tem conta? <a href="/signup.html">Criar cadastro</a></p>
        </div>
    </div>

    <div class="div-plataforma modal">
        <div class="cabecalho-agenda">
            <h1>Cadastro na agenda</h1>
            <div class="cabecalho-agenda-direita">
                <p class="contador-cadastrados"><span id="total-cadastrados-agenda">0</span> cadastrados</p>
                <button type="button" class="botao botao-sair" onclick="sairDaConta()">Sair</button>
            </div>
        </div>

        <div class="area-de-cadastro-e-lista">
            <div class="area-cadastro">
                <div class="textos-de-informacoes-cadastro">
                    <h2>Novo cadastro</h2>
                    <p>Preencha os dados da pessoa para incluir na lista</p>
                </div>

                <div class="grupos-campos-cadastro">
                    <div class="campo-cadastro">
                        <label for="cadastro-nome">Nome</label>
                        <input id="cadastro-nome" name="nome" type="text" placeholder="Nome completo" autocomplete="name">
                    </div>
                    <div class="campo-cadastro">
                        <label for="cadastro-email">E-mail</label>
                        <input id="cadastro-email" name="email" type="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>
                    </div>
                    <div class="campo-cadastro">
                        <label for="cadastro-telefone">Telefone</label>
                        <input id="cadastro-telefone" name="telefone" type="tel" placeholder="(00) 00000-0000" autocomplete="tel">
                    </div>
                </div>

                <button onclick="criarCadastroNaLista()">Cadastrar</button>
            </div>
            <div class="area-lista">
                <h2>Pessoas cadastradas</h2>
                <div class="lista-pessoas-cadastradas">
                    <p>Nenhum usuário cadastrado.</p>
                </div>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
